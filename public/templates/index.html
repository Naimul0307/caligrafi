<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - Arabic Transliteration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">      
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <div class="settings-container">
        <form id="settingsForm" onsubmit="event.preventDefault(); saveSettings();">

            <h1>Set Font Style and Weight</h1>

            <div class="form-group">
                <label for="fontSelector">Select Font:</label>
                <select id="fontSelector" name="fontSelector">
                    <option value="DiwaniLetterRegular">Diwani Letter Regular</option>
                    <option value="DiwaniBentRegular">Diwani Bent Regular</option>
                    <option value="FarsiSimpleBoldRegular">Farsi Simple Bold Regular</option>
                    <option value="Amiri-Italic">Amiri</option>
                    <option value="CairoPlay-Regular">Cairo</option>
                    <option value="Lateef-Regular">Lateef</option>
                    <option value="Mada-Regular">Mada</option>
                    <option value="ScheherazadeNew-Regular">Naskh</option>
                    <option value="Tajawal-Regular">Tajawal</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fontWeightSelector">Select Font Weight:</label>
                <select id="fontWeightSelector" name="fontWeightSelector">
                    <option value="normal">Normal</option>
                    <option value="bold">Bold</option>
                    <option value="lighter">Lighter</option>
                    <option value="bolder">Bolder</option>
                </select>
            </div>

            <h1>Set Canvas Size & Font Size</h1>

            <div class="form-group">
                <label for="canvasWidth">Canvas Width (px):</label>
                <input type="number" id="canvasWidth" name="canvasWidth" value="800" />
            </div>

            <div class="form-group">
                <label for="canvasHeight">Canvas Height (px):</label>
                <input type="number" id="canvasHeight" name="canvasHeight" value="500" />
            </div>

            <div class="form-group">
                <label for="fontSize">Font Size (px):</label>
                <input type="number" id="fontSize" name="fontSize" value="50" />
            </div>

            <h1>Set Export Image Size & Quality</h1>

            <div class="form-group">
                <label for="imageWidth">Image Export Width (px):</label>
                <input type="number" id="imageWidth" name="imageWidth" value="800" />
            </div>

            <div class="form-group">
                <label for="imageHeight">Image Export Height (px):</label>
                <input type="number" id="imageHeight" name="imageHeight" value="500" />
            </div>

            <div class="form-group">
                <label for="imageQuality">Image Quality (0.1 - 1):</label>
                <input type="number" id="imageQuality" name="imageQuality" step="0.1" min="0.1" max="1" value="1" />
            </div>

            <h1>Image Orientation</h1>

            <div class="form-group">
                <label for="orientationSelector">Select Orientation:</label>
                <select id="orientationSelector" name="orientationSelector">
                    <option value="landscape">Landscape</option>
                    <option value="portrait">Portrait</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fontColorInput">Image Font Color:</label>
                <input type="color" id="fontColorInput" name="fontColorInput" value="#000000" />
            </div>

            <h1>Print Settings</h1>

            <div class="form-group">
                <label for="printerSelector">Select Printer:</label>
                <select id="printerSelector" name="printerSelector">
                    <option value="">Loading printers...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="printOrientationSelector">Select Print Orientation:</label>
                <select id="printOrientationSelector" name="printOrientationSelector">
                    <option value="landscape">Landscape</option>
                    <option value="portrait">Portrait</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bg1">Background 1 (Landscape):</label>
                <div class="input-preview-group">
                    <input type="file" id="bg1" />
                    <img id="preview-bg1" class="thumb" />
                </div>
            </div>

            <div class="form-group">
                <label for="bg2">Background 2 (Landscape):</label>
                <div class="input-preview-group">
                    <input type="file" id="bg2" />
                    <img id="preview-bg2" class="thumb" />
                </div>
            </div>

            <div class="form-group">
                <label for="bg3">Background 1 (Portrait):</label>
                <div class="input-preview-group">
                    <input type="file" id="bg3" />
                    <img id="preview-bg3" class="thumb" />
                </div>
            </div>

            <div class="form-group">
                <label for="bg4">Background 2 (Portrait):</label>
                <div class="input-preview-group">
                    <input type="file" id="bg4" />
                    <img id="preview-bg4" class="thumb" />
                </div>
            </div>

            <div class="form-group">
                <label for="multiImageInput">Upload Canvas Background Images (Max 5):</label>
                <div class="input-preview-group">
                    <input type="file" id="multiImageInput" multiple accept="image/*" />
                    <div id="multiImagePreview"></div>
                </div>
            </div>

            <button type="submit">Save Settings</button>
            <button type="button" onclick="redirect()">Go to Home</button>
        </form>
    </div>

    <script src="../js/global-font.js"></script>
    <script src="../js/index.js"></script>
    <script>
        function redirect() {
            window.location.href = "home.html";
        }
    </script>
</body>
</html>
